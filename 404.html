<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    (function(l) {
      if (l.search[1] === '/' ) {
        var u = l.pathname.slice(1);
        l.replace(l.pathname.slice(0, 1) + '?' + u + l.hash);
      }
    }(window.location))
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
