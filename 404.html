<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafrex/spa-github-pages
    // This script checks to see if a redirect is present in the query string
    // and converts it back into the correct pushState URL for the
    // single page app
    // Add your base URL here, as well as the query parameter you
    // use to redirect (i.e. 'redirect')
    (function(l) {
      if (l.search) {
        var q = {};
        l.search.slice(1).split('&').forEach(function (v) {
          var a = v.split('=');
          q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
        });
        if (q.p !== undefined) {
          window.history.replaceState(null, null,
            (q.p||'') + (q.q?'?'+q.q:'') + l.hash
          );
        }
      }
    }(window.location))
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
